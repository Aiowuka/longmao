name: Longmao integration CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: integration-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install longmao dependencies
        run: npm ci
      - name: Clone pinned Totoro upstream
        shell: bash
        run: |
          git clone https://github.com/yuyuyudlc/Totoro.git ../Totoro
          git -C ../Totoro checkout 5b3199f864e114f4981403d05c94160ebdd730ab
          corepack pnpm --dir ../Totoro install --frozen-lockfile --ignore-scripts
      - name: Clone pinned WMPFDebugger upstream
        shell: bash
        run: |
          git clone https://github.com/evi0s/WMPFDebugger.git ../WMPFDebugger
          git -C ../WMPFDebugger checkout e65e3ec98ea38de8ea78fc0ad02d01d9b2fd0345
      - name: Check integration environment
        run: npm run integration:doctor
      - name: Run unit and native Totoro integration tests
        run: npm test
      - name: Run successful demo
        run: npm run demo
