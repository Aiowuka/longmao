name: Build diagnostic hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-one-click-installer
    paths:
      - '.github/workflows/build-diagnostic-hotfix.yml'
      - 'src/cdp-observer.mjs'
      - 'src/web.mjs'
      - 'web/app.js'
      - 'web/index.html'
      - 'patches/wmpf-debugger/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build offline diagnostic hotfix
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/out/longmao-diagnostic-hotfix"
          mkdir -p "$root/src" "$root/web" "$root/patches/wmpf-debugger"
          cp src/cdp-observer.mjs src/web.mjs "$root/src/"
          cp web/app.js web/index.html "$root/web/"
          cp patches/wmpf-debugger/apply-jscontext-routing.mjs "$root/patches/wmpf-debugger/"
          cp patches/wmpf-debugger/apply-miniapp-diagnostics.mjs "$root/patches/wmpf-debugger/"
          cp patches/wmpf-debugger/apply-result-jscontext-inference.mjs "$root/patches/wmpf-debugger/"
          cp patches/wmpf-debugger/apply-network-only-mode.mjs "$root/patches/wmpf-debugger/"
          cp patches/wmpf-debugger/apply-network-metadata-adapter.mjs "$root/patches/wmpf-debugger/"
          cat > "$root/apply.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          INSTALL_ROOT="${LONGMAO_INSTALL_ROOT:-$HOME/.local/opt/longmao}"
          RUNTIME_ROOT="${LONGMAO_RUNTIME_ROOT:-${XDG_DATA_HOME:-$HOME/.local/share}/longmao}"
          WMPF="$RUNTIME_ROOT/upstreams/WMPFDebugger"
          BACKUP="$RUNTIME_ROOT/hotfix-backups/diagnostic-$(date +%Y%m%d-%H%M%S)"

          [[ -f "$INSTALL_ROOT/src/cdp-observer.mjs" ]] || { echo "Longmao install not found: $INSTALL_ROOT" >&2; exit 1; }
          [[ -f "$WMPF/src/index.ts" ]] || { echo "WMPFDebugger not found: $WMPF" >&2; exit 1; }

          mkdir -p "$BACKUP/src" "$BACKUP/web" "$BACKUP/wmpf" "$INSTALL_ROOT/patches/wmpf-debugger"
          cp "$INSTALL_ROOT/src/cdp-observer.mjs" "$BACKUP/src/"
          cp "$INSTALL_ROOT/src/web.mjs" "$BACKUP/src/" 2>/dev/null || true
          cp "$INSTALL_ROOT/web/app.js" "$BACKUP/web/" 2>/dev/null || true
          cp "$INSTALL_ROOT/web/index.html" "$BACKUP/web/" 2>/dev/null || true
          cp "$WMPF/src/index.ts" "$BACKUP/wmpf/index.ts"

          if command -v longmao >/dev/null 2>&1; then
            longmao stop || true
          elif [[ -x "$INSTALL_ROOT/scripts/linux/longmao.sh" ]]; then
            "$INSTALL_ROOT/scripts/linux/longmao.sh" stop || true
          fi

          cp "$HERE/src/cdp-observer.mjs" "$INSTALL_ROOT/src/cdp-observer.mjs"
          cp "$HERE/src/web.mjs" "$INSTALL_ROOT/src/web.mjs"
          cp "$HERE/web/app.js" "$INSTALL_ROOT/web/app.js"
          cp "$HERE/web/index.html" "$INSTALL_ROOT/web/index.html"
          cp "$HERE"/patches/wmpf-debugger/*.mjs "$INSTALL_ROOT/patches/wmpf-debugger/"

          node "$HERE/patches/wmpf-debugger/apply-jscontext-routing.mjs" "$WMPF/src/index.ts"
          node "$HERE/patches/wmpf-debugger/apply-miniapp-diagnostics.mjs" "$WMPF/src/index.ts"
          node "$HERE/patches/wmpf-debugger/apply-result-jscontext-inference.mjs" "$WMPF/src/index.ts"
          node "$HERE/patches/wmpf-debugger/apply-network-only-mode.mjs" "$WMPF/src/index.ts"
          node "$HERE/patches/wmpf-debugger/apply-network-metadata-adapter.mjs" "$WMPF/src/index.ts"

          grep -q 'wmpf_routing_unavailable' "$INSTALL_ROOT/src/cdp-observer.mjs"
          grep -q 'LONGMAO_WMPF_JSCONTEXT_ROUTING_V1' "$WMPF/src/index.ts"
          grep -q 'LONGMAO_WMPF_MINIAPP_DIAGNOSTICS_V1' "$WMPF/src/index.ts"
          grep -q 'LONGMAO_WMPF_RESULT_JSCONTEXT_INFERENCE_V1' "$WMPF/src/index.ts"
          grep -q 'LONGMAO_WMPF_NETWORK_ONLY_MODE_V1' "$WMPF/src/index.ts"

          if command -v longmao >/dev/null 2>&1; then
            longmao start
          else
            "$INSTALL_ROOT/scripts/linux/longmao.sh" start
          fi

          echo
          echo "Diagnostic hotfix applied."
          echo "Backup: $BACKUP"
          echo "Open: http://127.0.0.1:3210"
          echo "Expected next event: wmpf_jscontexts / wmpf_jscontexts_empty / wmpf_routing_unavailable"
          EOF
          chmod +x "$root/apply.sh"
          cat > "$root/README.txt" <<'EOF'
          Longmao diagnostic hotfix

          This bundle is offline: it does not clone or fetch GitHub.

          Apply:
            unzip longmao-diagnostic-hotfix.zip
            cd longmao-diagnostic-hotfix
            bash apply.sh

          Then keep WeChat miniapp open and refresh http://127.0.0.1:3210.
          EOF
          (cd "$PWD/out" && zip -qr longmao-diagnostic-hotfix.zip longmao-diagnostic-hotfix)
          sha256sum "$PWD/out/longmao-diagnostic-hotfix.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: longmao-diagnostic-hotfix
          path: out/longmao-diagnostic-hotfix.zip
          if-no-files-found: error
