name: Build Linux installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-one-click-installer
    paths:
      - 'install.sh'
      - 'scripts/linux/**'
      - 'installer/linux/**'
      - 'Install Longmao.sh'
      - 'Uninstall Longmao.sh'
      - 'src/**'
      - 'web/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/linux-installer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Longmao tests
        run: npm test

      - name: Install packaging lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself shellcheck

      - name: Validate Linux shell scripts
        run: |
          bash -n install.sh scripts/linux/*.sh installer/linux/build.sh Install\ Longmao.sh Uninstall\ Longmao.sh
          shellcheck -x install.sh scripts/linux/*.sh installer/linux/build.sh Install\ Longmao.sh Uninstall\ Longmao.sh

      - name: Smoke-test managed process PATH inheritance
        run: |
          test_root="$(mktemp -d)"
          mkdir -p "$test_root/install/scripts/linux" "$test_root/runtime/node/bin" "$test_root/runtime/logs" "$test_root/runtime/pids" "$test_root/runtime/work" "$test_root/config" "$test_root/bin"
          cp scripts/linux/common.sh "$test_root/install/scripts/linux/common.sh"
          cat >"$test_root/runtime/node/bin/longmao-private-tool" <<'EOF'
          #!/usr/bin/env bash
          echo private-runtime-ok
          EOF
          chmod +x "$test_root/runtime/node/bin/longmao-private-tool"

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
          bash -c '
            source "$LONGMAO_INSTALL_ROOT/scripts/linux/common.sh"
            start_managed path-test "$LONGMAO_RUNTIME_ROOT/work" "longmao-private-tool"
            for _ in {1..30}; do
              grep -q "private-runtime-ok" "$LONGMAO_LOGS/path-test.out.log" 2>/dev/null && exit 0
              sleep 0.1
            done
            exit 1
          '

      - name: Smoke-test managed env assignment commands
        run: |
          test_root="$(mktemp -d)"
          mkdir -p "$test_root/install/scripts/linux" "$test_root/runtime/logs" "$test_root/runtime/pids" "$test_root/runtime/work" "$test_root/config" "$test_root/bin"
          cp scripts/linux/common.sh "$test_root/install/scripts/linux/common.sh"
          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
          bash -c '
            source "$LONGMAO_INSTALL_ROOT/scripts/linux/common.sh"
            start_managed env-test "$LONGMAO_RUNTIME_ROOT/work" "PORT=3456 NODE_ENV=production bash -c '\''echo "\$PORT:\$NODE_ENV"'\''"
            for _ in {1..30}; do
              grep -q "3456:production" "$LONGMAO_LOGS/env-test.out.log" 2>/dev/null && exit 0
              sleep 0.1
            done
            exit 1
          '

      - name: Smoke-test public curl bootstrap
        run: |
          LONGMAO_BOOTSTRAP_TEST_ONLY=1 bash install.sh | tee /tmp/longmao-bootstrap.txt
          grep -q '^Longmao bootstrap OK$' /tmp/longmao-bootstrap.txt
          grep -q 'ref=6d0d52ef2124c4142a9877bb6915b916e98a0bb9' /tmp/longmao-bootstrap.txt

      - name: Smoke-test unified Longmao CLI
        run: |
          test_root="$(mktemp -d)"
          mkdir -p "$test_root/install/scripts/linux" "$test_root/runtime/logs" "$test_root/config" "$test_root/bin"
          cp scripts/linux/common.sh scripts/linux/longmao.sh scripts/linux/start.sh scripts/linux/stop.sh scripts/linux/status.sh scripts/linux/configure.sh scripts/linux/repair.sh scripts/linux/uninstall.sh "$test_root/install/scripts/linux/"
          chmod +x "$test_root/install/scripts/linux/"*.sh

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
            "$test_root/install/scripts/linux/longmao.sh" version | grep -q '^Longmao 0.5.0$'

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
            "$test_root/install/scripts/linux/longmao.sh" help | grep -q 'longmao status'

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
            "$test_root/install/scripts/linux/longmao.sh" status | grep -q 'Longmao local stack status'

          if HOME="$test_root/home" \
             LONGMAO_INSTALL_ROOT="$test_root/install" \
             LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
             LONGMAO_CONFIG_ROOT="$test_root/config" \
             LONGMAO_BIN_ROOT="$test_root/bin" \
               "$test_root/install/scripts/linux/longmao.sh" definitely-not-a-command; then
            echo "unknown command unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Smoke-test Linux uninstaller in isolated HOME
        run: |
          test_root="$(mktemp -d)"
          mkdir -p "$test_root/install" "$test_root/runtime" "$test_root/config" "$test_root/bin" "$test_root/data/applications" "$test_root/external"
          touch "$test_root/install/app-file" "$test_root/runtime/runtime-file" "$test_root/config/config-file"
          touch "$test_root/bin/longmao" "$test_root/bin/longmao-stop" "$test_root/bin/longmao-status" "$test_root/bin/longmao-configure" "$test_root/bin/longmao-repair" "$test_root/bin/longmao-uninstall"
          touch "$test_root/data/applications/longmao.desktop" "$test_root/data/applications/longmao-status.desktop" "$test_root/data/applications/longmao-uninstall.desktop"
          touch "$test_root/external/system-dependency-sentinel"

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
          XDG_DATA_HOME="$test_root/data" \
            scripts/linux/uninstall.sh --yes --keep-config

          test ! -e "$test_root/install"
          test ! -e "$test_root/runtime"
          test -e "$test_root/config/config-file"
          test -e "$test_root/external/system-dependency-sentinel"
          test ! -e "$test_root/bin/longmao"
          test ! -e "$test_root/data/applications/longmao.desktop"

          HOME="$test_root/home" \
          LONGMAO_INSTALL_ROOT="$test_root/install" \
          LONGMAO_RUNTIME_ROOT="$test_root/runtime" \
          LONGMAO_CONFIG_ROOT="$test_root/config" \
          LONGMAO_BIN_ROOT="$test_root/bin" \
          XDG_DATA_HOME="$test_root/data" \
            scripts/linux/uninstall.sh --yes

          test ! -e "$test_root/config"
          test -e "$test_root/external/system-dependency-sentinel"

      - name: Build .run installer
        run: ./installer/linux/build.sh 0.5.0

      - name: Inspect self-extracting archive
        run: |
          chmod +x installer/linux/output/LongmaoSetup-0.5.0-linux-x64.run
          installer/linux/output/LongmaoSetup-0.5.0-linux-x64.run --list > /tmp/longmao-run-list.txt
          grep -q 'scripts/linux/install.sh' /tmp/longmao-run-list.txt
          grep -q 'scripts/linux/longmao.sh' /tmp/longmao-run-list.txt
          grep -q 'scripts/linux/uninstall.sh' /tmp/longmao-run-list.txt
          grep -q 'src/web.mjs' /tmp/longmao-run-list.txt

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: LongmaoSetup-0.5.0-linux-x64
          path: |
            installer/linux/output/LongmaoSetup-0.5.0-linux-x64.run
            installer/linux/output/LongmaoSetup-0.5.0-linux-x64.run.sha256
          if-no-files-found: error
          retention-days: 30
